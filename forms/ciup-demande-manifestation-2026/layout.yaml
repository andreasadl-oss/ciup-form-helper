# Field positions on the CIUP "Demande de manifestation 2026" form (form.pdf).
# Coordinates are PDF points from the bottom-left; y is the text baseline.
# Page 0 = first page. Send the filled form to evenements.internes@ciup.fr, 2–3+ weeks ahead.
pdf: form.pdf

fields:
