<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event request form helper</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Title, language switch, unofficial notice and privacy note (src/panels/header.ts). -->
    <header id="page-header"></header>
    <main>
      <!-- One mount element per panel. Each panel is a module under src/panels/.
           DOM order follows the user's flow (SPEC "What it does"); on phones it is one column. -->
      <div id="notices" aria-live="polite"></div>
      <div class="layout">
        <div class="col-input">
          <section id="prompt-panel"></section>
          <section id="yaml-panel"></section>
          <section id="form-panel"></section>
        </div>
        <div class="col-output">
          <section id="preview-panel"></section>
          <section id="actions-panel"></section>
        </div>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
